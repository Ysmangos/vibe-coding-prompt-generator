
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vibe Coding Prompt Generator</title>
  <style>
    body {
      background-color: #fcb6c6;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .monitor {
      background-color: #fef3dc;
      border: 4px solid #000;
      border-radius: 16px;
      width: 420px;
      padding: 24px;
      box-shadow: 6px 6px #000;
    }

    h1 {
      font-size: 24px;
      color: #d34b28;
      text-align: center;
      margin-bottom: 24px;
    }

    select, button {
      width: 100%;
      padding: 16px;
      margin-bottom: 16px;
      border: 2px solid #000;
      background-color: #fff;
      font-size: 16px;
    }

    button {
      background-color: #4d91c6;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
    }

    .prompt-box {
      border: 2px solid #000;
      padding: 12px 12px 12px 12px;
      background-color: #fff;
      font-size: 16px;
      color: #000;
      min-height: 60px;
      position: relative;
      padding-right: 36px;
    }

    .copy-icon {
      position: absolute;
      top: 8px;
      right: 8px;
      cursor: pointer;
      font-size: 16px;
      background-color: #eee;
      border: 1px solid #000;
      padding: 2px 6px;
      z-index: 2;
    }

    .tooltip {
      visibility: hidden;
      background-color: #000;
      color: #fff;
      text-align: center;
      border-radius: 4px;
      padding: 4px 8px;
      position: absolute;
      top: -30px;
      right: 0;
      z-index: 1;
      font-size: 12px;
    }

    .show-tooltip {
      visibility: visible;
      opacity: 1;
      transition: opacity 0.3s;
    }
  </style>
</head>
<body>
  <div class="monitor">
    <h1>Vibe Coding Prompt Generator</h1>
    <select id="category">
      <option value="Food">Food</option>
      <option value="Games">Games</option>
      <option value="Productivity">Productivity</option>
      <option value="Art">Art</option>
      <option value="Goofy">Goofy</option>
      <option value="Health">Health and Wellness</option>
      <option value="Animals">Animals</option>
      <option value="Entertainment">Entertainment</option>
      <option value="Creative">Creative</option>
      <option value="Border Collie">Border Collie</option>
    </select>
    <button onclick="generatePrompt()">Generate</button>
    <div class="prompt-box" id="promptDisplay">
      <span class="copy-icon" onclick="copyPrompt()">📋</span>
      <span class="tooltip" id="tooltip">Prompt copied to clipboard.</span>
    </div>
  </div>

  <script>
    const prompts = {
      Food: [
        "Create a website that generates unique recipes based on random ingredients.",
        "Design a cooking app that helps users meal plan for the week.",
        "Build a virtual fridge where users input items and get recipe suggestions."
      ],
      Games: [
        "Make a mini game where the character dodges falling objects.",
        "Create a retro-style 2D maze explorer.",
        "Design a quiz game with different categories and a score tracker."
      ],
      Productivity: [
        "Build a daily to-do app with motivational quotes.",
        "Create a time tracker that logs productive vs. idle time.",
        "Design a goal-setting app with progress visualization."
      ],
      Art: [
        "Make a generative art project using random shapes and colors.",
        "Create a pixel art editor that lets users draw and export their work.",
        "Design a virtual sketchpad with brush, pencil, and eraser tools."
      ],
      Goofy: [
        "Build a fart soundboard with animations.",
        "Make a site that translates serious text into pirate speak.",
        "Create a dancing potato mascot that responds to keyboard input."
      ],
      Health: [
        "Create a hydration tracker with daily reminders.",
        "Design a breathing exercise web app.",
        "Build a daily stretching routine generator."
      ],
      Animals: [
        "Build a random animal fact generator.",
        "Create a virtual pet care simulator.",
        "Make a site that shows animal GIFs on button click."
      ],
      Entertainment: [
        "Design a movie recommendation engine based on mood.",
        "Build a random music genre explorer.",
        "Create a celebrity trivia quiz app."
      ],
      Creative: [
        "Make a story idea generator based on three random words.",
        "Design a web poetry prompt mixer.",
        "Build a name generator for fictional worlds."
      ],
      "Border Collie": [
        "Build a training task randomizer for border collies.",
        "Create a border collie personality quiz.",
        "Design a daily activity planner for active dogs."
      ]
    };

    function generatePrompt() {
      const category = document.getElementById("category").value;
      const options = prompts[category];
      const prompt = options[Math.floor(Math.random() * options.length)];
      document.getElementById("promptDisplay").childNodes[2].textContent = prompt;
    }

    function copyPrompt() {
      const promptText = document.getElementById("promptDisplay").childNodes[2].textContent;
      navigator.clipboard.writeText(promptText).then(() => {
        const tooltip = document.getElementById("tooltip");
        tooltip.classList.add("show-tooltip");
        setTimeout(() => tooltip.classList.remove("show-tooltip"), 1500);
      });
    }
  </script>
</body>
</html>
